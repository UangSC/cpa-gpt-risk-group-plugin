<!doctype html>
<html lang="zh-CN" data-plugin-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <title>Codex 风控检测与分类 · CLIProxyAPI 插件</title>
    <meta
      name="description"
      content="通过糖果题、模型指纹或画鹈鹕 HTML 2D 动画巡检 CLIProxyAPI 管理的 Codex 凭证，记录检测依据，默认仅检测，也可按需管理模型前缀或调度优先级。"
    />
  </head>
  <body>
    <div id="root">
      <div id="boot-status" style="max-width:560px;margin:12vh auto;padding:24px;font-family:system-ui,sans-serif;color:#243247;background:#f5f8fc;border:1px solid #d7dfeb;border-radius:14px">
        <h2 style="font-size:18px">正在加载巡检页面…</h2>
        <p id="boot-message">正在准备页面和本地设置。</p>
        <pre id="boot-error" hidden style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px"></pre>
        <button type="button" onclick="location.reload()">重新加载</button>
      </div>
    </div>
    <script>
      (function () {
        document.documentElement.setAttribute('data-boot-script', 'ready');
        document.getElementById('boot-message').textContent = '正在加载界面组件和本地设置。';
        function showStartupError(message) {
          var status = document.getElementById('boot-status');
          if (!status) return;
          status.querySelector('h2').textContent = '页面启动失败';
          document.getElementById('boot-message').textContent = '请重新加载；如果仍然失败，请保留下面的错误提示。';
          var detail = document.getElementById('boot-error');
          detail.hidden = false;
          detail.textContent = message;
        }
        window.addEventListener('error', function (event) {
          var target = event.target;
          showStartupError(event.message || '页面资源加载失败：' + (target && (target.src || target.href) || '未知资源'));
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          showStartupError(reason && reason.message ? reason.message : String(reason));
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
